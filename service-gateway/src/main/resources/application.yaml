server:
  port: 8080

spring:
  application:
    name: service-gateway
  cloud:
    gateway:
      mvc:
        globalcors:
          cors-configurations:
            '[/**]':
              allowedOriginPatterns:
                - "*"
              allowedMethods:
                - "*"
              allowedHeaders:
                - "*"
              allowCredentials: true
        routes:
          - id: mama-salama-core
            uri: lb://mama-salama-core
            predicates:
              - Path=/api/core/**
            filters:
              - StripPrefix=2
          - id: mama-salama-ai
            uri: lb://mama-salama-ai
            predicates:
              - Path=/api/ai/**
            filters:
              - StripPrefix=2

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
