services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mama_salama_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d mama_salama_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mama-net

  # ── Keycloak (Identity Provider) ─────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/mama_salama_db
      KC_DB_USERNAME: ${DB_USERNAME}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KC_HTTP_PORT: 8080
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes/mama-salama:/opt/keycloak/themes/mama-salama:ro
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - mama-net

  # ── Eureka (service-discovery) ────────────────────────────────────────────────
  eureka:
    build:
      context: ./service-discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - mama-net

  # ── MinIO object storage ──────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mama-net

  # ── Spring Boot backend ───────────────────────────────────────────────────────
  mama-salama-core:
    build:
      context: ./mama-salama-backend
    ports:
      - "8081:8081"
    environment:
      # Database — override localhost with the postgres container name
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mama_salama_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Service discovery — use container name instead of localhost
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET:-mama-salama-backend-secret}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-knowledge-base-docs}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-adminmamasalama@yopmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - mama-net

  # ── API Gateway ───────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./service-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    depends_on:
      eureka:
        condition: service_healthy
    networks:
      - mama-net

  # ── Python AI service (FastAPI + ChromaDB) ────────────────────────────────────
  ai:
    build:
      context: ./mama-salama-ai
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Point to the eureka container, not host.docker.internal
      EUREKA_SERVER: http://eureka:8761/eureka/
      # Register with the Docker service name so other containers can reach us
      EUREKA_INSTANCE_HOST: ai
      PORT: 8000
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      eureka:
        condition: service_healthy
    networks:
      - mama-net

  # ── Frontend (React + Nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ../mama-salama-frontend
      args:
        KEYCLOAK_URL: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8090}
    ports:
      - "80:80"
    environment:
      BACKEND_URL: http://gateway:8080
    depends_on:
      - gateway
    networks:
      - mama-net

volumes:
  postgres_data:
  chroma_data:
  minio_data:

networks:
  mama-net:
    driver: bridge
