server:
  port: 8081

spring:
  application:
    name: mama-salama-core
  datasource:
    url: jdbc:postgresql://localhost:5432/mama_salama_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
#        format_sql: true
    open-in-view: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  phone-number: ${TWILIO_PHONE_NUMBER}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

application:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - http://localhost:8080
      - https://7281-41-141-41-215.ngrok-free.app
  security:
    jwt:
      secret-key: ${JWT_SECRET:QE5jUmZValhucjI3NXU4eC9BP0QoRytLYlBkU2dWa1lw}
      expiration: 86400000        # 24 hours
      refresh-token:
        expiration: 604800000     # 7 days

springdoc:
  server-url: http://localhost:8080/api/core
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /api/core/v3/api-docs/swagger-config
    url: /api/core/v3/api-docs
    tags-sorter: alpha
    operations-sorter: method


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: WARN
    com.mamasalama: DEBUG
    org.springframework.security: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: DEBUG
