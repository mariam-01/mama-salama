server:
  port: 8081

spring:
  application:
    name: mama-salama-core
  datasource:
    url: jdbc:postgresql://localhost:5432/mama_salama_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8090}/realms/mama-salama/protocol/openid-connect/certs

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  phone-number: ${TWILIO_PHONE_NUMBER}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

keycloak:
  server-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8090}
  realm: mama-salama
  admin-client-id: mama-salama-backend
  admin-client-secret: ${KEYCLOAK_BACKEND_CLIENT_SECRET:mama-salama-backend-secret}
  master-admin-username: ${KEYCLOAK_ADMIN:admin}
  master-admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

application:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - http://localhost:8080
      - https://7281-41-141-41-215.ngrok-free.app

springdoc:
  server-url: http://localhost:8080/api/core
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /api/core/v3/api-docs/swagger-config
    url: /api/core/v3/api-docs
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: WARN
    com.mamasalama: DEBUG
    org.springframework.security: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: DEBUG
