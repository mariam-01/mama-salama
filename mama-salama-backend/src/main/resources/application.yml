server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: mama-salama
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4.1-mini
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: false   # set to true after installing pgvector binary + CREATE EXTENSION vector
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

  datasource:
    url: jdbc:postgresql://localhost:5432/mama_salama_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
#        format_sql: true
    open-in-view: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  phone-number: ${TWILIO_PHONE_NUMBER}

application:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-seconds: 30
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - https://7281-41-141-41-215.ngrok-free.app
  security:
    jwt:
      secret-key: ${JWT_SECRET:QE5jUmZValhucjI3NXU4eC9BP0QoRytLYlBkU2dWa1lw}
      expiration: 86400000        # 24 hours
      refresh-token:
        expiration: 604800000     # 7 days

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: WARN
    com.mamasalama: DEBUG
    org.springframework.security: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: DEBUG
