# Local test values only; no external services are needed to load the context.
spring:
  datasource:
    url: jdbc:h2:mem:mama_salama_test;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 2525
    username: test
    password: test
  cloud:
    discovery:
      enabled: false
    openfeign:
      client:
        config:
          mama-salama-ai:
            url: http://localhost:8000

eureka:
  client:
    enabled: false

minio:
  endpoint: http://localhost:9000
  access-key: test-access-key
  secret-key: test-secret-key
  bucket: test-bucket

twilio:
  account-sid: AC00000000000000000000000000000000
  auth-token: test-auth-token
  phone-number: "+15005550006"

application:
  admin:
    email: admin@example.test
    password: test-admin-password

logging:
  level:
    org.hibernate.SQL: WARN
